<text x="590.0" y="444.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2933">β-CELL DYSFUNCTION</text>
<text x="590.0" y="475.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.3" font-style="italic" fill="#52606d">the central, necessary lesion in the transition to overt T2DM</text>
<line x1="590.0" y1="492" x2="590.0" y2="522" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowhead)"/>
