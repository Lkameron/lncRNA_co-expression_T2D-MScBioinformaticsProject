<text x="590.0" y="544.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#1f2933">Islet-Level Consequences</text>
<text x="590.0" y="572.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.3" font-style="italic" fill="#52606d">↓ glucose-stimulated insulin secretion · ↓ β-cell mass (apoptosis) · altered</text>
<text x="590.0" y="588.3" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.3" font-style="italic" fill="#52606d">islet architecture</text>
