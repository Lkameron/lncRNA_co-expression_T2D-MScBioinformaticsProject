<text x="590.0" y="38" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2933">Convergent Mechanisms of Islet β-Cell Dysfunction in T2DM</text>
<text x="590.0" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" font-style="italic">Multiple, co-ordinately disrupted stress pathways converge on a common failure state</text>
<rect x="390.0" y="88" width="400" height="54" rx="10" ry="10" fill="#eef2f7" stroke="#334155" stroke-width="1.6"/>
<text x="590.0" y="116.4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#1f2933">Peripheral Insulin Resistance</text>
<line x1="590.0" y1="142" x2="590.0" y2="168" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<rect x="390.0" y="168" width="400" height="58" rx="10" ry="10" fill="#e1edf9" stroke="#334155" stroke-width="1.6"/>
<text x="590.0" y="190.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2933">β-Cell Compensatory Hyperinsulinaemia</text>
<text x="590.0" y="217.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.3" font-style="italic" fill="#52606d">attempt to maintain normoglycaemia</text>
