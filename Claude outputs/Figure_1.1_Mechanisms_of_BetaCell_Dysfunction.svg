<text x="590.0" y="648.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1f2933">Type 2 Diabetes Mellitus</text>
<text x="590.0" y="678.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.3" font-style="italic" fill="#52606d">chronic hyperglycaemia</text>
