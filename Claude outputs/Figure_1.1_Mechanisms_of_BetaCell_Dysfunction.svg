<text x="960.0" y="189.4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933">Compensation sustained</text>
<text x="960.0" y="214.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.3" font-style="italic" fill="#52606d">normoglycaemia maintained —</text>
<text x="960.0" y="231.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.3" font-style="italic" fill="#52606d">outside this dissertation's scope</text>
<line x1="590.0" y1="226" x2="590.0" y2="256" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<rect x="30.0" y="256" width="210" height="108" rx="10" ry="10" fill="#e6f4ea" stroke="#334155" stroke-width="1.6"/>
<text x="135.0" y="288.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2933">Glucotoxicity</text>
<text x="135.0" y="313.3" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.2" font-style="italic" fill="#52606d">chronic hyperglycaemia →</text>
<text x="135.0" y="328.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.2" font-style="italic" fill="#52606d">IL6/IL11 signalling →</text>
<text x="135.0" y="343.7" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.2" font-style="italic" fill="#52606d">fibrotic change</text>
<rect x="257.5" y="256" width="210" height="108" rx="10" ry="10" fill="#e6f4ea" stroke="#334155" stroke-width="1.6"/>
<text x="362.5" y="288.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2933">Lipotoxicity</text>
<text x="362.5" y="313.3" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.2" font-style="italic" fill="#52606d">↑ free fatty acids → ER</text>
<text x="362.5" y="328.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.2" font-style="italic" fill="#52606d">stress; MALAT1/PTBP1/PKM2</text>
<text x="362.5" y="343.7" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.2" font-style="italic" fill="#52606d">dysregulation</text>
<rect x="485.0" y="256" width="210" height="108" rx="10" ry="10" fill="#e6f4ea" stroke="#334155" stroke-width="1.6"/>
<text x="590.0" y="286.4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2933">Oxidative &amp;</text>
<text x="590.0" y="304.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2933">Mitochondrial Stress</text>
<text x="590.0" y="330.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.2" font-style="italic" fill="#52606d">ferroptosis-related gene</text>
<text x="590.0" y="345.3" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.2" font-style="italic" fill="#52606d">dysregulation</text>
<rect x="712.5" y="256" width="210" height="108" rx="10" ry="10" fill="#e6f4ea" stroke="#334155" stroke-width="1.6"/>
<text x="817.5" y="288.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2933">ER Stress Response</text>
<text x="817.5" y="313.3" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.2" font-style="italic" fill="#52606d">cytokine/UPR pathways</text>
<text x="817.5" y="328.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.2" font-style="italic" fill="#52606d">intersect T2DM genetic risk</text>
<text x="817.5" y="343.7" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.2" font-style="italic" fill="#52606d">variants</text>
<rect x="940.0" y="256" width="210" height="108" rx="10" ry="10" fill="#e6f4ea" stroke="#334155" stroke-width="1.6"/>
<text x="1045.0" y="286.4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2933">Epigenetic</text>
<text x="1045.0" y="304.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2933">Dedifferentiation</text>
<text x="1045.0" y="330.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.2" font-style="italic" fill="#52606d">polycomb-mediated loss of</text>
<text x="1045.0" y="345.3" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.2" font-style="italic" fill="#52606d">identity; ↓RFX6, ↓Sox5</text>
