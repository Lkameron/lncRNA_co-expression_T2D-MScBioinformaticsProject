<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1331" viewBox="0 0 1200 1331">
<rect x="0" y="0" width="1200" height="1620" fill="#ffffff"/>
<defs>
<marker id="arrowhead" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
  <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
</marker>
</defs>
<text x="600.0" y="42" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2933">Nested Cross-Validation Machine Learning Workflow</text>
<text x="600.0" y="66" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" font-style="italic">Disease-stage classification (ND vs IGT vs T2D) from VST-normalised expression</text>
<rect x="340.0" y="95" width="520" height="64" rx="10" ry="10" fill="#eef2f7" stroke="#334155" stroke-width="1.6"/>
<text x="600.0" y="120.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#1f2933">VST-normalised expression matrix</text>
<text x="600.0" y="148.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-style="italic" fill="#52606d">all samples × all candidate features</text>
<line x1="600.0" y1="159" x2="600.0" y2="199" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<rect x="300.0" y="199" width="600" height="62" rx="10" ry="10" fill="#e1edf9" stroke="#334155" stroke-width="1.6"/>
<text x="600.0" y="223.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#1f2933">Outer CV: stratified 5-fold split</text>
<text x="600.0" y="251.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-style="italic" fill="#52606d">entire block below is repeated once per outer fold</text>
<line x1="600.0" y1="261" x2="600.0" y2="299" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<rect x="300.0" y="299" width="290" height="60" rx="10" ry="10" fill="#e1edf9" stroke="#334155" stroke-width="1.6"/>
<text x="445.0" y="330.4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#1f2933">Outer training folds (4/5)</text>
<rect x="610.0" y="299" width="290" height="60" rx="10" ry="10" fill="#e1edf9" stroke="#334155" stroke-width="1.6"/>
<text x="755.0" y="322.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#1f2933">Outer test fold (1/5)</text>
<text x="755.0" y="350.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-style="italic" fill="#52606d">held out, untouched</text>
<line x1="445.0" y1="359" x2="445.0" y2="393" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<rect x="270.0" y="393" width="660" height="76" rx="10" ry="10" fill="#dbeafe" stroke="#334155" stroke-width="1.6" stroke-dasharray="7,5"/>
<text x="600.0" y="424.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#1f2933">Inner CV (nested within outer-train fold only)</text>
<text x="600.0" y="452.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-style="italic" fill="#52606d">hyperparameter tuning + feature / hub-gene selection</text>
<line x1="600.0" y1="469" x2="600.0" y2="503" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<rect x="270.0" y="503" width="660" height="54" rx="10" ry="10" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="600.0" y="523.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#1f2933">Selected features + tuned hyperparameters</text>
<text x="600.0" y="551.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-style="italic" fill="#52606d">train-fold only — no test-fold leakage</text>
<line x1="600.0" y1="557" x2="600.0" y2="587" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<text x="600.0" y="603" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2933">trained on the outer-training fold</text>
<rect x="40.0" y="615" width="262" height="66" rx="10" ry="10" fill="#e6f4ea" stroke="#334155" stroke-width="1.6"/>
<text x="171.0" y="649.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1f2933">Random Forest</text>
<rect x="326.0" y="615" width="262" height="66" rx="10" ry="10" fill="#e6f4ea" stroke="#334155" stroke-width="1.6"/>
<text x="457.0" y="639.4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1f2933">L2-Regularised Logistic</text>
<text x="457.0" y="658.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1f2933">Regression</text>
<rect x="612.0" y="615" width="262" height="66" rx="10" ry="10" fill="#e6f4ea" stroke="#334155" stroke-width="1.6"/>
<text x="743.0" y="649.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1f2933">SVM (RBF kernel)</text>
<rect x="898.0" y="615" width="262" height="66" rx="10" ry="10" fill="#e6f4ea" stroke="#334155" stroke-width="1.6"/>
<text x="1029.0" y="649.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1f2933">XGBoost</text>
<path d="M 171.0,681 L 171.0,697 L 600.0,713" fill="none" stroke="#475569" stroke-width="1.6"/>
<path d="M 457.0,681 L 457.0,697 L 600.0,713" fill="none" stroke="#475569" stroke-width="1.6"/>
<path d="M 743.0,681 L 743.0,697 L 600.0,713" fill="none" stroke="#475569" stroke-width="1.6"/>
<path d="M 1029.0,681 L 1029.0,697 L 600.0,713" fill="none" stroke="#475569" stroke-width="1.6"/>
<line x1="600.0" y1="713" x2="600.0" y2="721" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<rect x="340.0" y="721" width="520" height="58" rx="10" ry="10" fill="#fdf3d8" stroke="#334155" stroke-width="1.6"/>
<text x="600.0" y="751.4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#1f2933">Evaluate each model on the held-out outer test fold</text>
<path d="M 755.0,359 C 795.0,619 926.0,710.0 846.0,750.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-dasharray="6,5" marker-end="url(#arrowhead)"/>
<text x="825.0" y="479" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52606d" font-style="italic">untouched until</text>
<text x="825.0" y="494" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52606d" font-style="italic">evaluation</text>
<line x1="600.0" y1="779" x2="600.0" y2="809" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<rect x="340.0" y="809" width="520" height="54" rx="10" ry="10" fill="#fdf3d8" stroke="#334155" stroke-width="1.6"/>
<text x="600.0" y="837.4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#1f2933">Per-fold AUC &amp; balanced accuracy</text>
<path d="M 340.0,836.0 C 254.0,836.0 254.0,230.0 300.0,230.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrowhead)"/>
<text x="248.0" y="504.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" font-style="italic">repeat × 5</text>
<text x="248.0" y="520.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#52606d">outer folds</text>
<line x1="600.0" y1="863" x2="600.0" y2="895" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<text x="600.0" y="879" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" font-style="italic">after all 5 outer folds</text>
<rect x="280.0" y="895" width="640" height="78" rx="10" ry="10" fill="#fdf3d8" stroke="#334155" stroke-width="1.6"/>
<text x="600.0" y="927.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#1f2933">Aggregate across 5 outer folds</text>
<text x="600.0" y="955.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-style="italic" fill="#52606d">mean AUC &amp; balanced accuracy ± 95% CI (t-distribution, df=4), clipped to [0,1]</text>
<line x1="600.0" y1="973" x2="600.0" y2="1003" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<path d="M 310.0,1003 L 890.0,1003" stroke="#475569" stroke-width="1.6"/>
<line x1="310.0" y1="1003" x2="310.0" y2="1025" stroke="#475569" stroke-width="1.6" marker-end="url(#arrowhead)"/>
<line x1="890.0" y1="1003" x2="890.0" y2="1025" stroke="#475569" stroke-width="1.6" marker-end="url(#arrowhead)"/>
<text x="310.0" y="1043" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#5b3a70" letter-spacing="0.5">FEATURE IMPORTANCE</text>
<text x="890.0" y="1043" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#9a3f1f" letter-spacing="0.5">STATISTICAL SIGNIFICANCE</text>
<rect x="100.0" y="1061" width="420" height="64" rx="10" ry="10" fill="#f0e6f6" stroke="#334155" stroke-width="1.6"/>
<text x="310.0" y="1086.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#1f2933">Random Forest Gini importance</text>
<text x="310.0" y="1114.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-style="italic" fill="#52606d">mean decrease in node impurity per feature</text>
<rect x="680.0" y="1061" width="420" height="64" rx="10" ry="10" fill="#fde9e1" stroke="#334155" stroke-width="1.6"/>
<text x="890.0" y="1086.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#1f2933">Shuffle class labels</text>
<text x="890.0" y="1114.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-style="italic" fill="#52606d">re-run the entire nested pipeline above × n permutations</text>
<line x1="310.0" y1="1125" x2="310.0" y2="1149" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<line x1="890.0" y1="1125" x2="890.0" y2="1149" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<rect x="100.0" y="1149" width="420" height="64" rx="10" ry="10" fill="#f0e6f6" stroke="#334155" stroke-width="1.6"/>
<text x="310.0" y="1174.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#1f2933">SHAP values</text>
<text x="310.0" y="1202.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-style="italic" fill="#52606d">Shapley-based, model-agnostic, additive attribution</text>
<rect x="680.0" y="1149" width="420" height="64" rx="10" ry="10" fill="#fde9e1" stroke="#334155" stroke-width="1.6"/>
<text x="890.0" y="1174.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#1f2933">Null distribution of AUC</text>
<text x="890.0" y="1202.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-style="italic" fill="#52606d">built from n label-permuted re-runs</text>
<line x1="890.0" y1="1213" x2="890.0" y2="1237" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<rect x="680.0" y="1237" width="420" height="64" rx="10" ry="10" fill="#fde9e1" stroke="#334155" stroke-width="1.6"/>
<text x="890.0" y="1262.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#1f2933">Empirical p-value</text>
<text x="890.0" y="1290.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-style="italic" fill="#52606d">observed AUC vs. null distribution</text>
</svg>