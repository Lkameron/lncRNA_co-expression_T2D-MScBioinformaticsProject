<text x="890.0" y="324" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#1f2933">Identifies modules of co-expressed genes and</text>
<text x="890.0" y="342" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#1f2933">the hub genes central to each module</text>
<text x="890.0" y="366" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.8" font-weight="400" fill="#2f6f4f" font-style="italic">Advantage: captures coordinated regulation and</text>
<text x="890.0" y="382" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.8" font-weight="400" fill="#2f6f4f" font-style="italic">reduces dimensionality to biologically meaningful modules</text>
