<text x="290.0" y="324" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#1f2933">Identifies genes with statistically significant</text>
<text x="290.0" y="342" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#1f2933">expression change between conditions</text>
<text x="290.0" y="366" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.8" font-weight="400" fill="#8b0000" font-style="italic">Limitation: misses coordinated regulation and</text>
<text x="290.0" y="382" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.8" font-weight="400" fill="#8b0000" font-style="italic">modest-effect genes embedded in larger networks</text>
