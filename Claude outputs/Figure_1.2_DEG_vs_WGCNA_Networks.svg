<text x="590.0" y="38" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2933">From Individual Genes to Co-expression Networks</text>
<text x="590.0" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" font-style="italic">Why differential expression alone is insufficient to capture coordinated regulation</text>
