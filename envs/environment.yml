name: arcana
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - r-base=4.3
  - pip
  - numpy
  - pandas
  - scipy
  - matplotlib
  - seaborn
  - scikit-learn
  - pip:
    - fastapi>=0.110
    - uvicorn[standard]>=0.29
    - websockets>=12
    - pydantic>=2
    - python-multipart
    - aiofiles
    - xgboost>=2.0
    - shap>=0.44
    - umap-learn>=0.5
    - pdfplumber>=0.10
    - watchdog>=4.0
    - rpy2>=3.5
